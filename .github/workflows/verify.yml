name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Source and complete-index publication guards
        run: |
          python -B scripts/check_publication.py
          python -B scripts/check_publication.py --index
      - name: Native PDF, QR and font tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libzbar0 fonts-dejavu-core
      - name: Hash-locked generator and test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r btc_envelope_maker/requirements-runtime.txt -r btc_envelope_maker/requirements-test.txt
      - name: Public-vector PDF, QR, recovery and schema tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -B -m pytest -p no:cacheprovider --basetemp "$TMPDIR/generator-tests" btc_envelope_maker/tests -q
